name: Lost and found API

on:
  push:
    paths: ['ch01_task01/**', '.github/workflows/lost-and-found-api.yml']
  pull_request:
    paths: ['ch01_task01/**', '.github/workflows/lost-and-found-api.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ch01_task01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ch01_task01/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
